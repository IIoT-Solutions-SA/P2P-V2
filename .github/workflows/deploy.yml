name: Deploy to OCI
on:
  push:
    branches:
      - hamza-backend
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changes
        id: changes
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.sha }}"
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BEFORE_SHA="$(git rev-parse "$AFTER_SHA^" 2>/dev/null || true)"
          fi
          if [ -z "$BEFORE_SHA" ]; then
            BEFORE_SHA="$AFTER_SHA"
          fi
          echo "Comparing $BEFORE_SHA..$AFTER_SHA"
          BACKEND_CHANGED=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- 'p2p-backend-app/' | head -1)
          FRONTEND_CHANGED=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- 'p2p-frontend-app/' 'docker/nginx.conf' | head -1)
          COMPOSE_CHANGED=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- 'docker/docker-compose.yml' 'docker/*.Dockerfile' | head -1)
          echo "backend=$( [ -n "$BACKEND_CHANGED" ] && echo true || echo false )" >> $GITHUB_OUTPUT
          echo "frontend=$( [ -n "$FRONTEND_CHANGED" ] && echo true || echo false )" >> $GITHUB_OUTPUT
          echo "compose=$( [ -n "$COMPOSE_CHANGED" ] && echo true || echo false )" >> $GITHUB_OUTPUT
          echo "Backend changed: $( [ -n "$BACKEND_CHANGED" ] && echo YES || echo no )"
          echo "Frontend changed: $( [ -n "$FRONTEND_CHANGED" ] && echo YES || echo no )"
          echo "Compose/Dockerfile changed: $( [ -n "$COMPOSE_CHANGED" ] && echo YES || echo no )"
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.OCI_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
      - name: Authorize Mini PC operational SSH key
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.OCI_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail
          public_key='${{ secrets.PEERLINK_MINIPC_SSH_PUBLIC_KEY }}'
          [ -n "$public_key" ]
          install -d -m 700 "$HOME/.ssh"
          touch "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          grep -qxF "$public_key" "$HOME/.ssh/authorized_keys" || printf '%s\n' "$public_key" >> "$HOME/.ssh/authorized_keys"
          echo 'Mini PC operational SSH key authorized'
          REMOTE
      - name: Prepare production environment and backups
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.OCI_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/P2P-V2
          umask 077

          # Preserve the currently deployed credentials while moving them out of
          # tracked Compose source. Credential rotation is a separate controlled
          # maintenance action because changing database passwords requires
          # coordinated database-user updates.
          touch docker/.env
          current_compose="$(git show HEAD:docker/docker-compose.yml)"
          read_env() { grep -m1 "^$1=" "$2" 2>/dev/null | cut -d= -f2- || true; }
          pg_password="$(read_env P2P_POSTGRES_PASSWORD docker/.env)"
          mongo_password="$(read_env P2P_MONGO_PASSWORD docker/.env)"
          secret_key="$(read_env P2P_SECRET_KEY docker/.env)"
          [ -n "$pg_password" ] || pg_password="$(printf '%s\n' "$current_compose" | sed -n 's/.*POSTGRES_PASSWORD=//p' | head -1)"
          [ -n "$mongo_password" ] || mongo_password="$(printf '%s\n' "$current_compose" | sed -n 's/.*MONGO_INITDB_ROOT_PASSWORD=//p' | head -1)"
          [ -n "$secret_key" ] || secret_key="$(read_env SECRET_KEY p2p-backend-app/.env)"
          [ -n "$secret_key" ] || secret_key="$(printf '%s\n' "$current_compose" | sed -n 's/.*SECRET_KEY=//p' | head -1)"
          [ -n "$pg_password" ] && [ -n "$mongo_password" ] && [ -n "$secret_key" ]
          pg_encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$pg_password")"
          mongo_encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$mongo_password")"
          cat > docker/.env <<EOF
          P2P_POSTGRES_PASSWORD=$pg_password
          P2P_POSTGRES_PASSWORD_URLENCODED=$pg_encoded
          P2P_MONGO_PASSWORD=$mongo_password
          P2P_MONGO_PASSWORD_URLENCODED=$mongo_encoded
          P2P_SECRET_KEY=$secret_key
          EOF

          backup_dir="deploy-backups/$(TZ=Asia/Riyadh date +%Y%m%d-%H%M%S-AST)-pre-kacst-controls"
          mkdir -p "$backup_dir"
          docker exec p2p-postgres pg_dump -U p2p_user -d p2p_sandbox -Fc > "$backup_dir/postgres.dump"
          docker exec p2p-postgres pg_dump -U p2p_user -d supertokens -Fc > "$backup_dir/supertokens.dump"
          docker exec p2p-mongodb mongodump --username p2p_user --password "$mongo_password" --authenticationDatabase admin --db p2p_sandbox --archive > "$backup_dir/mongodb.archive"
          test -s "$backup_dir/postgres.dump"
          test -s "$backup_dir/supertokens.dump"
          test -s "$backup_dir/mongodb.archive"
          echo "Production backups created in $backup_dir"
          REMOTE
      - name: Pull latest code
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.OCI_HOST }} \
            "cd /home/ubuntu/P2P-V2 && git pull --ff-only origin hamza-backend"
      - name: Rebuild and restart backend
        if: steps.changes.outputs.backend == 'true' && steps.changes.outputs.compose != 'true'
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.OCI_HOST }} \
            "cd /home/ubuntu/P2P-V2/docker && docker compose build --no-cache backend && docker compose up -d --no-deps backend"
          echo "Backend rebuilt, migrated, and restarted"
      - name: Rebuild and restart frontend
        if: steps.changes.outputs.frontend == 'true' && steps.changes.outputs.compose != 'true'
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.OCI_HOST }} \
            "cd /home/ubuntu/P2P-V2/docker && docker compose build --no-cache frontend && docker compose up -d --no-deps frontend"
          echo "Frontend rebuilt and restarted"
      - name: Rebuild and reconcile all changed services
        if: steps.changes.outputs.compose == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.OCI_HOST }} \
            "cd /home/ubuntu/P2P-V2/docker && docker compose build --no-cache backend frontend && docker compose up -d"
          echo "All services rebuilt and reconciled from Compose"
      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.OCI_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/P2P-V2/docker
          sleep 10
          docker compose ps
          curl -fsS http://localhost:8000/api/v1/health/ >/dev/null
          curl -fsS http://localhost:5173/ >/dev/null
          echo 'Backend: OK'
          echo 'Frontend: OK'

          docker compose exec -T backend alembic current </dev/null | grep -q 'f4a9c2d78110'
          docker compose exec -T backend python - <<'PY'
          from app.core.config import settings
          assert settings.ENVIRONMENT == 'production'
          assert settings.SESSION_IDLE_TIMEOUT_MINUTES == 30
          assert settings.SESSION_ABSOLUTE_LIFETIME_HOURS == 8
          assert settings.LOGIN_MAX_FAILED_ATTEMPTS == 5
          assert settings.LOGIN_LOCKOUT_MINUTES == 15
          assert settings.SESSION_IDLE_TIMEOUT_SECONDS_TEST is None
          assert settings.SESSION_ABSOLUTE_LIFETIME_SECONDS_TEST is None
          assert settings.LOGIN_LOCKOUT_SECONDS_TEST is None
          print('Production controls: idle=30m absolute=8h failures=5 lockout=15m')
          PY
          docker compose exec -T backend python -m unittest \
            tests.test_fixes tests.test_session_security tests.test_login_protection </dev/null

          # Controlled live endpoint check against a nonexistent address. This
          # sends no email, touches no real user, verifies the fifth-attempt
          # lock and generic anti-enumeration response, then removes its row.
          acceptance_email="kacst-production-$(date +%s)@iiot-test.sa"
          key="$(docker compose exec -T backend python -c \
            "from app.services.login_protection_service import identity_key; print(identity_key('$acceptance_email'))" </dev/null)"
          cleanup_acceptance() {
            docker exec p2p-postgres psql -U p2p_user -d p2p_sandbox -c \
              "DELETE FROM login_attempts WHERE identity_key='$key'" </dev/null >/dev/null || true
          }
          trap cleanup_acceptance EXIT
          expected_message='Invalid email or password. Please try again later.'
          for attempt in 1 2 3 4 5 6; do
            response="$(curl -sS -w '\n%{http_code}' -H 'Content-Type: application/json' \
              -d "{\"email\":\"$acceptance_email\",\"password\":\"Wrong-password-123!\"}" \
              http://localhost:8000/api/v1/auth/custom-signin)"
            status="${response##*$'\n'}"
            body="${response%$'\n'*}"
            response_fields="$(python3 -c \
              'import json,sys; data=json.load(sys.stdin); print(data.get("status", "") + "|" + data.get("message", ""))' \
              <<<"$body")"
            echo "Attempt $attempt: HTTP $status, generic response verified"
            if [ "$attempt" -lt 5 ]; then
              [ "$status" = 401 ]
            else
              [ "$status" = 429 ]
            fi
            [ "$response_fields" = "ERROR|$expected_message" ]
          done
          state="$(docker exec p2p-postgres psql -U p2p_user -d p2p_sandbox -Atc \
            "SELECT failed_attempts || '|' || (locked_until > now()) FROM login_attempts WHERE identity_key='$key'" </dev/null)"
          [ "$state" = '5|true' ]
          cleanup_acceptance
          trap - EXIT
          echo 'Live failed-login acceptance: fifth-attempt lock and generic response PASS'
          REMOTE
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

