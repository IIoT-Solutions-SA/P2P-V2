name: Deploy to OCI
on:
  push:
    branches:
      - hamza-backend
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changes
        id: changes
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.sha }}"
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BEFORE_SHA="$(git rev-parse "$AFTER_SHA^" 2>/dev/null || true)"
          fi
          if [ -z "$BEFORE_SHA" ]; then
            BEFORE_SHA="$AFTER_SHA"
          fi
          echo "Comparing $BEFORE_SHA..$AFTER_SHA"
          BACKEND_CHANGED=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- 'p2p-backend-app/' | head -1)
          FRONTEND_CHANGED=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- 'p2p-frontend-app/' | head -1)
          COMPOSE_CHANGED=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- 'docker/docker-compose.yml' 'docker/*.Dockerfile' | head -1)
          echo "backend=$( [ -n "$BACKEND_CHANGED" ] && echo true || echo false )" >> $GITHUB_OUTPUT
          echo "frontend=$( [ -n "$FRONTEND_CHANGED" ] && echo true || echo false )" >> $GITHUB_OUTPUT
          echo "compose=$( [ -n "$COMPOSE_CHANGED" ] && echo true || echo false )" >> $GITHUB_OUTPUT
          echo "Backend changed: $( [ -n "$BACKEND_CHANGED" ] && echo YES || echo no )"
          echo "Frontend changed: $( [ -n "$FRONTEND_CHANGED" ] && echo YES || echo no )"
          echo "Compose/Dockerfile changed: $( [ -n "$COMPOSE_CHANGED" ] && echo YES || echo no )"
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.OCI_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
      - name: Pull latest code
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.OCI_HOST }} \
            "cd /home/ubuntu/P2P-V2 && git pull origin hamza-backend"
      - name: Rebuild and restart backend
        if: steps.changes.outputs.backend == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.OCI_HOST }} \
            "cd /home/ubuntu/P2P-V2/docker && docker compose restart backend"
          echo "Backend restarted (source mounted as volume, auto-reloads)"
      - name: Rebuild and restart frontend
        if: steps.changes.outputs.frontend == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.OCI_HOST }} \
            "cd /home/ubuntu/P2P-V2/docker && \
             docker compose stop frontend && \
             docker compose rm -f frontend && \
             docker rmi docker-frontend -f 2>/dev/null; \
             docker builder prune -af 2>/dev/null; \
             docker compose build --no-cache frontend && \
             docker compose up -d frontend"
          echo "Frontend rebuilt and restarted"
      - name: Restart all services
        if: steps.changes.outputs.compose == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.OCI_HOST }} \
            "cd /home/ubuntu/P2P-V2/docker && docker compose up -d"
          echo "All services reconciled from compose"
      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.OCI_HOST }} \
            "cd /home/ubuntu/P2P-V2/docker && \
             sleep 10 && \
             docker compose ps && \
             echo '---' && \
             curl -sf http://localhost:8000/api/v1/health > /dev/null && echo 'Backend: OK' || echo 'Backend: FAILED' && \
             curl -sf http://localhost:5173 > /dev/null && echo 'Frontend: OK' || echo 'Frontend: FAILED'"
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
