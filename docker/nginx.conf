server {
  listen 80;
  server_name localhost;

  # Serve static files from the root
  root /usr/share/nginx/html;
  index index.html;

  # Browser hardening headers. The public TLS reverse proxy remains responsible
  # for HSTS and the deployment-specific CSP.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Keep API and SuperTokens traffic on the same origin so the application
  # works through localhost, Tailscale, and production hostnames.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host backend;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Never let browsers retain an old application shell after a frontend rebuild.
  # Hashed JS/CSS assets can still be cached normally.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  # Single-page application fallback for React Router.
  location / {
    try_files $uri /index.html;
  }
}